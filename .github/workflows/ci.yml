name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore AtividadePoo.sln

      - name: Compilar
        run: dotnet build AtividadePoo.sln --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test AtividadePoo.sln --configuration Release --no-build --verbosity normal
